[package]
name = "gigahost-init"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "PID 1 of a container virtual machine: switches into the image's disk and runs its process"
repository = "https://github.com/gigahost-apps/kernel-linux"
publish = false

[[bin]]
name = "gigahost-init"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
exit = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
