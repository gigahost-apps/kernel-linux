name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  init:
    name: init (fmt, clippy, test) and shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: fmt
        run: cargo fmt --manifest-path init/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path init/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path init/Cargo.toml
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh tests/features/*.sh tests/init-systems/*.sh tests/init-systems/init-features.openrc

  release:
    name: release build and boot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Let the runner use /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 e2fsprogs
      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/build.sh
      - name: Build twice and compare (tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/build.sh --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          if-no-files-found: error
      - name: Boot tests
        run: tests/boot.sh
